<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Моя Канбан-доска</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-panel">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <div class="board-switcher" id="board-switcher">
                <button class="add-board-btn" onclick="createNewBoard()" title="Создать новую доску">+</button>
            </div>
            <button class="list-view-btn" id="list-toggle-btn" onclick="toggleListView()">
                📋 Список задач
            </button>
        </div>
        
        <div class="io-buttons">
            <button class="io-btn" onclick="exportData()" title="Сохранить все доски в файл">📥 Скачать</button>
            <button class="io-btn" onclick="document.getElementById('import-file').click()" title="Загрузить доски из файла">📤 Загрузить</button>
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
    </div>

    <!-- Заголовок для режима Досок -->
    <div class="board-header-area" id="board-header-area">
        <div class="board-title" id="board-title-text">ЗАГРУЗКА...</div>
        <button class="settings-btn" onclick="openColumnsSettings()">⚙️ Настроить колонки</button>
    </div>

    <!-- Контейнер для Досок -->
    <div class="board-scroll-wrapper" id="board-scroll-wrapper">
        <div id="boards-container"></div>
    </div>

    <!-- Контейнер для Списка задач -->
    <div class="list-view-container" id="list-view-container">
        <div class="list-header" id="list-header-title"></div>
        <table class="tasks-table">
            <thead>
                <tr>
                    <th style="width: 15%;">Статус</th>
                    <th style="width: 75%;">Задача</th>
                    <th style="width: 10%; text-align: right;">Действие</th>
                </tr>
            </thead>
            <tbody id="list-view-tbody"></tbody>
        </table>
    </div>

    <!-- Модальное окно настроек колонок -->
    <div class="modal-overlay" id="columns-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройка колонок</h2>
                <button class="close-modal" onclick="closeColumnsSettings()">×</button>
            </div>
            <div id="col-settings-list"></div>
            <button class="add-col-btn" onclick="addNewColumn()">+ Добавить колонку</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
