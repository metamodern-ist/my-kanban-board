<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow"> <!-- Запрет индексации поисковиками -->
    <title>Моя Канбан-доска</title>
    <style>
        :root {
            --bg-color: #f7f8fc;
            --text-main: #1a5b9c;
            --text-dark: #333;
            
            --col-todo-bg: #e0f0ff;
            --col-todo-accent: #a3c8f0;
            --col-progress-bg: #f0e2fc;
            --col-progress-accent: #d0a3f0;
            --col-review-bg: #fdf2e0;
            --col-review-accent: #f0d0a3;
            --col-done-bg: #dff6e8;
            --col-done-accent: #a3f0c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .board-switcher {
            display: flex;
            gap: 10px;
            background: white;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .switch-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #777;
            transition: all 0.3s ease;
        }

        .switch-btn:hover { background: #f0f4f8; color: var(--text-main); }
        .switch-btn.active { background: var(--text-main); color: white; box-shadow: 0 4px 10px rgba(26, 91, 156, 0.3); }

        .io-buttons { display: flex; gap: 10px; }

        .io-btn {
            background: white;
            color: var(--text-main);
            border: 1px solid #d0e0f0;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .io-btn:hover { background: #f0f7ff; border-color: var(--text-main); }

        .board-title {
            background: white;
            color: var(--text-main);
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-align: center;
        }

        .board-wrapper { width: 100%; max-width: 1200px; }
        .board-wrapper.hidden { display: none; }

        .board {
            display: flex;
            gap: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 600px;
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        .column:last-child { border-right: none; }

        .column-header {
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .col-todo { background-color: var(--col-todo-bg); }
        .col-progress { background-color: var(--col-progress-bg); }
        .col-review { background-color: var(--col-review-bg); }
        .col-done { background-color: var(--col-done-bg); }

        .tasks-container {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 200px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            cursor: grab;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:active { cursor: grabbing; }
        .card.dragging { opacity: 0.5; transform: scale(0.98); }

        .card::before {
            content: '';
            display: block;
            width: 40px;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 5px;
        }

        .col-todo .card::before { background-color: var(--col-todo-accent); }
        .col-progress .card::before { background-color: var(--col-progress-accent); }
        .col-review .card::before { background-color: var(--col-review-accent); }
        .col-done .card::before { background-color: var(--col-done-accent); }

        .card-text {
            color: var(--text-dark);
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            padding-right: 45px;
            white-space: pre-wrap;
        }

        .edit-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--text-main);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            resize: vertical;
            outline: none;
            box-shadow: 0 0 0 2px rgba(26, 91, 156, 0.1);
            min-height: 60px;
        }

        .edit-hint {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            display: block;
            user-select: none;
        }

        .card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .card-actions { opacity: 1; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .action-btn:hover { background: rgba(0,0,0,0.05); }
        .edit-btn { color: #4a90e2; }
        .delete-btn { color: #ff6b6b; font-size: 16px; font-weight: bold; }

        .add-task-form {
            padding: 0 15px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-task-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 6px;
            resize: none;
            font-size: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.7);
            transition: background 0.2s;
        }

        .add-task-form textarea:focus {
            background: white;
            box-shadow: 0 0 0 2px rgba(26, 91, 156, 0.2);
        }

        .add-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .add-btn:hover { background: var(--text-main); color: white; }

        @media (max-width: 900px) {
            .board { flex-direction: column; }
            .column { min-height: 300px; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.05); }
            .top-panel { flex-direction: column; align-items: stretch; }
            .board-switcher, .io-buttons { justify-content: center; }
            .io-btn, .switch-btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="top-panel">
        <div class="board-switcher">
            <button class="switch-btn active" onclick="switchBoard('work', this)">💼 Работа</button>
            <button class="switch-btn" onclick="switchBoard('home', this)">🏠 Дом</button>
        </div>
        <div class="io-buttons">
            <button class="io-btn" onclick="exportData()" title="Сохранить все задачи в файл">📥 Скачать</button>
            <button class="io-btn" onclick="document.getElementById('import-file').click()" title="Загрузить задачи из файла">📤 Загрузить</button>
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
    </div>

    <div class="board-title" id="board-title-text">РАБОЧИЕ ЗАДАЧИ</div>

    <!-- Доска Работа -->
    <div class="board-wrapper" id="board-work">
        <div class="board">
            <div class="column col-todo">
                <div class="column-header">Сделать</div>
                <div class="tasks-container" id="work-todo"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-work-todo"></textarea>
                    <button class="add-btn" onclick="addTask('work', 'todo')">+ Добавить</button>
                </div>
            </div>
            <div class="column col-progress">
                <div class="column-header">В процессе</div>
                <div class="tasks-container" id="work-progress"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-work-progress"></textarea>
                    <button class="add-btn" onclick="addTask('work', 'progress')">+ Добавить</button>
                </div>
            </div>
            <div class="column col-review">
                <div class="column-header">На проверке</div>
                <div class="tasks-container" id="work-review"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-work-review"></textarea>
                    <button class="add-btn" onclick="addTask('work', 'review')">+ Добавить</button>
                </div>
            </div>
            <div class="column col-done">
                <div class="column-header">Готово</div>
                <div class="tasks-container" id="work-done"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-work-done"></textarea>
                    <button class="add-btn" onclick="addTask('work', 'done')">+ Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Доска Дом -->
    <div class="board-wrapper hidden" id="board-home">
        <div class="board">
            <div class="column col-todo">
                <div class="column-header">Сделать</div>
                <div class="tasks-container" id="home-todo"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-home-todo"></textarea>
                    <button class="add-btn" onclick="addTask('home', 'todo')">+ Добавить</button>
                </div>
            </div>
            <div class="column col-progress">
                <div class="column-header">В процессе</div>
                <div class="tasks-container" id="home-progress"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-home-progress"></textarea>
                    <button class="add-btn" onclick="addTask('home', 'progress')">+ Добавить</button>
                </div>
            </div>
            <div class="column col-review">
                <div class="column-header">На проверке</div>
                <div class="tasks-container" id="home-review"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-home-review"></textarea>
                    <button class="add-btn" onclick="addTask('home', 'review')">+ Добавить</button>
                </div>
            </div>
            <div class="column col-done">
                <div class="column-header">Готово</div>
                <div class="tasks-container" id="home-done"></div>
                <div class="add-task-form">
                    <textarea rows="2" placeholder="Новая задача..." id="input-home-done"></textarea>
                    <button class="add-btn" onclick="addTask('home', 'done')">+ Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let appData = JSON.parse(localStorage.getItem('kanban_app_data')) || {
            work: { todo: [], progress: [], review: [], done: [] },
            home: { todo: [], progress: [], review: [], done: [] }
        };

        function saveData() {
            localStorage.setItem('kanban_app_data', JSON.stringify(appData));
        }

        function switchBoard(boardName, btnElement) {
            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.querySelectorAll('.board-wrapper').forEach(wrapper => wrapper.classList.add('hidden'));
            document.getElementById(`board-${boardName}`).classList.remove('hidden');

            document.getElementById('board-title-text').textContent = boardName === 'work' ? 'РАБОЧИЕ ЗАДАЧИ' : 'ДОМАШНИЕ ЗАДАЧИ';
        }

        function renderBoard(boardName) {
            const boardData = appData[boardName];

            for (const status in boardData) {
                const container = document.getElementById(`${boardName}-${status}`);
                if (!container) continue;
                container.innerHTML = '';

                boardData[status].forEach((task, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.draggable = true;
                    card.dataset.id = task.id;
                    card.dataset.board = boardName;
                    card.dataset.status = status;
                    card.dataset.index = index;

                    card.innerHTML = `
                        <div class="card-actions">
                            <button class="action-btn edit-btn" onclick="startEdit('${boardName}', '${status}', ${index})" title="Редактировать">✏️</button>
                            <button class="action-btn delete-btn" onclick="deleteTask('${boardName}', '${status}', ${index})" title="Удалить">✕</button>
                        </div>
                        <div class="card-text">${escapeHtml(task.text)}</div>
                    `;

                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragend', handleDragEnd);
                    container.appendChild(card);
                });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTask(boardName, status) {
            const input = document.getElementById(`input-${boardName}-${status}`);
            const text = input.value.trim();
            
            if (text) {
                appData[boardName][status].push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    text: text
                });
                input.value = '';
                saveData();
                renderBoard(boardName);
            }
        }

        function deleteTask(boardName, status, index) {
            if(confirm('Удалить эту задачу?')) {
                appData[boardName][status].splice(index, 1);
                saveData();
                renderBoard(boardName);
            }
        }

        function startEdit(boardName, status, index) {
            const container = document.getElementById(`${boardName}-${status}`);
            const card = container.children[index];
            const task = appData[boardName][status][index];
            
            card.draggable = false;
            card.querySelector('.card-actions').style.display = 'none';
            
            const textDiv = card.querySelector('.card-text');
            const editWrapper = document.createElement('div');
            
            const textarea = document.createElement('textarea');
            textarea.className = 'edit-input';
            textarea.value = task.text;
            textarea.rows = Math.max(3, task.text.split('\n').length);
            
            const hint = document.createElement('span');
            hint.className = 'edit-hint';
            hint.textContent = 'Enter — новая строка | Ctrl+Enter — сохранить';
            
            editWrapper.appendChild(textarea);
            editWrapper.appendChild(hint);
            textDiv.replaceWith(editWrapper);
            
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);

            const saveEdit = () => {
                const newText = textarea.value.trim();
                if (newText) {
                    task.text = newText;
                    saveData();
                }
                renderBoard(boardName);
            };

            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    saveEdit();
                } else if (e.key === 'Escape') {
                    renderBoard(boardName);
                }
            });

            textarea.addEventListener('blur', saveEdit);
            textarea.addEventListener('mousedown', (e) => e.stopPropagation());
        }

        let draggedCardId = null;
        let draggedFromBoard = null;
        let draggedFromStatus = null;

        function handleDragStart(e) {
            if (e.target.tagName === 'TEXTAREA') {
                e.preventDefault();
                return;
            }
            const card = e.target;
            draggedCardId = card.dataset.id;
            draggedFromBoard = card.dataset.board;
            draggedFromStatus = card.dataset.status;
            
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => card.style.display = 'none', 0);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            e.target.style.display = 'block';
            document.querySelectorAll('.tasks-container').forEach(c => {
                c.style.backgroundColor = 'transparent';
            });
        }

        document.querySelectorAll('.tasks-container').forEach(container => {
            container.addEventListener('dragover', (e) => {
                const containerBoard = container.id.split('-')[0];
                if (containerBoard === draggedFromBoard) {
                    e.preventDefault(); 
                    e.dataTransfer.dropEffect = 'move';
                    container.style.backgroundColor = 'rgba(255,255,255,0.3)';
                }
            });

            container.addEventListener('dragleave', () => {
                container.style.backgroundColor = 'transparent';
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                container.style.backgroundColor = 'transparent';

                const parts = container.id.split('-');
                const dropBoard = parts[0];
                const dropStatus = parts[1];

                if (draggedFromBoard !== dropBoard || draggedFromStatus === dropStatus) {
                    return;
                }

                const taskIndex = appData[draggedFromBoard][draggedFromStatus].findIndex(t => t.id === draggedCardId);
                
                if (taskIndex > -1) {
                    const [movedTask] = appData[draggedFromBoard][draggedFromStatus].splice(taskIndex, 1);
                    appData[dropBoard][dropStatus].push(movedTask);
                    
                    saveData();
                    renderBoard(dropBoard);
                }
            });
        });

        document.querySelectorAll('textarea').forEach(textarea => {
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const parts = textarea.id.replace('input-', '').split('-');
                    addTask(parts[0], parts[1]);
                }
            });
        });

        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            const date = new Date().toISOString().slice(0,10);
            a.download = `kanban_backup_${date}.json`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (importedData.work && importedData.home) {
                        if(confirm('Вы уверены? Текущие задачи будут заменены данными из файла.')) {
                            appData = importedData;
                            saveData();
                            renderBoard('work');
                            renderBoard('home');
                            alert('Данные успешно загружены!');
                        }
                    } else {
                        alert('Ошибка: неверный формат файла резервной копии.');
                    }
                } catch (error) {
                    alert('Ошибка при чтении файла.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // Первичный рендер
        renderBoard('work');
        renderBoard('home');
    </script>
</body>
</html>
