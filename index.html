<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Моя Канбан-доска</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-mobile.css">
</head>
<body>

    <!-- ПАНЕЛЬ ДЛЯ ПК -->
    <div class="desktop-top-panel">
        <div class="board-switcher-wrapper">
            <div class="board-switcher" id="board-switcher">
                <button class="add-board-btn" onclick="createNewBoard()" title="Создать новую доску">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>
        
        <div class="desktop-menu-container">
            <button class="desktop-menu-btn" id="desktop-menu-btn" onclick="toggleDesktopMenu()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                Действия
            </button>
            <div class="desktop-dropdown" id="desktop-dropdown">
                <button class="dropdown-item" id="list-toggle-btn" onclick="toggleListView(); toggleDesktopMenu();">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    Список задач
                </button>
                <button class="dropdown-item" onclick="exportData(); toggleDesktopMenu();">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Скачать
                </button>
                <button class="dropdown-item" onclick="document.getElementById('import-file').click(); toggleDesktopMenu();">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Загрузить
                </button>
                <button class="dropdown-item" onclick="openColumnsSettings(); toggleDesktopMenu();">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Настроить статусы
                </button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" onclick="toggleTheme()">
                    <span id="desktop-theme-icon" style="display: flex; align-items: center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span> 
                    <span id="desktop-theme-text">Тёмная тема</span>
                </button>
            </div>
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
    </div>

    <!-- ШАПКА ДЛЯ МОБИЛОК -->
    <div class="mobile-header">
        <div class="mobile-title">
            <span id="mobile-board-icon">💼</span> <span id="mobile-board-name">РАБОЧИЕ ЗАДАЧИ</span>
        </div>
        <button class="burger-btn" id="burger-btn" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </button>
    </div>

    <!-- МОБИЛЬНОЕ МЕНЮ -->
    <div class="mobile-menu-overlay" id="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>
    <div class="mobile-menu-drawer" id="mobile-menu-drawer">
        <div class="drawer-header">
            <h2>Меню</h2>
            <button class="close-drawer-btn" onclick="toggleMobileMenu()">✕</button>
        </div>
        <div class="drawer-content">
            <div class="drawer-section">
                <span class="drawer-label">Мои доски</span>
                <div class="drawer-boards-list" id="drawer-boards-list"></div>
                <button class="drawer-btn-create" onclick="createNewBoard(); toggleMobileMenu();">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Создать доску
                </button>
            </div>
            <div class="drawer-section">
                <span class="drawer-label">Действия</span>
                <button class="drawer-action-main" id="mobile-list-toggle-btn" onclick="toggleListView(); toggleMobileMenu();">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    Список задач
                </button>
                
                <button class="drawer-action-main" onclick="openColumnsSettings(); toggleMobileMenu();">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Настроить статусы
                </button>

                <div class="drawer-actions-grid">
                    <button class="drawer-action-btn" onclick="exportData(); toggleMobileMenu();">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Скачать
                    </button>
                    <button class="drawer-action-btn" onclick="document.getElementById('import-file').click(); toggleMobileMenu();">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Загрузить
                    </button>
                    <button class="drawer-action-btn" onclick="toggleTheme()" id="theme-btn-mobile">
                        <span id="mobile-theme-icon" style="display: flex; align-items: center;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        </span>
                        Тема
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ЗАГОЛОВОК ДОСКИ (МИНИМАЛИСТИЧНЫЙ) -->
    <div class="board-header-area" id="board-header-area">
        <div class="board-title" id="board-title-text">ЗАГРУЗКА...</div>
    </div>

    <!-- ДОСКИ -->
    <div class="board-scroll-wrapper" id="board-scroll-wrapper">
        <div id="boards-container"></div>
    </div>

    <!-- РЕЖИМ СПИСКА -->
    <div class="list-view-container" id="list-view-container">
        <table class="tasks-table">
            <thead>
                <tr>
                    <th style="width: 15%;">Статус</th>
                    <th style="width: 75%;">Задача</th>
                    <th style="width: 10%; text-align: right;">Действие</th>
                </tr>
            </thead>
            <tbody id="list-view-tbody"></tbody>
            <tbody class="list-add-tbody">
                <tr class="list-add-row">
                    <td class="list-add-status-cell"></td>
                    <td>
                        <input type="text" id="list-new-task-text" class="list-add-input" placeholder="Новая задача..." onkeydown="if(event.key === 'Enter') addTaskFromList()">
                    </td>
                    <td>
                        <button class="list-add-btn" onclick="addTaskFromList()">Добавить</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК СТАТУСОВ -->
    <div class="modal-overlay" id="columns-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройка статусов</h2>
                <button class="close-modal" onclick="closeColumnsSettings()">×</button>
            </div>
            <div id="col-settings-list"></div>
            <button class="add-col-btn" onclick="addNewColumn()">+ Добавить статус</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА ИКОНКИ -->
    <div class="modal-overlay" id="icon-modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Иконка доски</h2>
                <button class="close-modal" onclick="closeIconSettings()">×</button>
            </div>
            <div class="icon-picker-grid" id="icon-picker-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
